<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="carBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="carSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="carRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="motoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
  </defs>

  <!-- Sky & City Horizon -->
  <rect width="1280" height="320" fill="url(#skyGrad)"/>
  <!-- Distant Buildings -->
  <rect x="50" y="160" width="110" height="160" fill="#1e293b" opacity="0.6"/>
  <rect x="180" y="120" width="90" height="200" fill="#0f172a" opacity="0.7"/>
  <rect x="300" y="180" width="140" height="140" fill="#1e293b" opacity="0.5"/>
  <rect x="680" y="140" width="120" height="180" fill="#0f172a" opacity="0.6"/>
  <rect x="830" y="100" width="160" height="220" fill="#1e293b" opacity="0.7"/>
  <rect x="1020" y="170" width="120" height="150" fill="#0f172a" opacity="0.5"/>

  <!-- Road & Intersection -->
  <rect y="300" width="1280" height="420" fill="url(#roadGrad)"/>
  
  <!-- Road Markings / Lane Lines -->
  <line x1="0" y1="520" x2="1280" y2="520" stroke="#fbbf24" stroke-width="4" stroke-dasharray="35 25"/>
  <line x1="0" y1="360" x2="1280" y2="360" stroke="#f8fafc" stroke-width="3" stroke-dasharray="25 20" opacity="0.5"/>
  <line x1="0" y1="660" x2="1280" y2="660" stroke="#f8fafc" stroke-width="4"/>

  <!-- Pedestrian Zebra Crossing -->
  <g fill="#f8fafc" opacity="0.4">
    <rect x="1100" y="320" width="30" height="380"/>
    <rect x="1150" y="320" width="30" height="380"/>
    <rect x="1200" y="320" width="30" height="380"/>
    <rect x="1250" y="320" width="30" height="380"/>
  </g>

  <!-- Left Car (Blue Sedan) -->
  <g transform="translate(60, 270)">
    <!-- Shadow -->
    <ellipse cx="100" cy="180" rx="90" ry="14" fill="#020617" opacity="0.6"/>
    <!-- Car Body -->
    <path d="M 15 150 L 40 90 L 140 90 L 175 130 L 185 165 L 10 165 Z" fill="url(#carBlue)"/>
    <!-- Windows -->
    <path d="M 45 95 L 75 95 L 75 125 L 30 125 Z" fill="#0f172a" opacity="0.7"/>
    <path d="M 85 95 L 135 95 L 160 125 L 85 125 Z" fill="#0f172a" opacity="0.7"/>
    <!-- Wheels -->
    <circle cx="50" cy="165" r="22" fill="#0f172a"/>
    <circle cx="50" cy="165" r="10" fill="#94a3b8"/>
    <circle cx="150" cy="165" r="22" fill="#0f172a"/>
    <circle cx="150" cy="165" r="10" fill="#94a3b8"/>
    <!-- Lights -->
    <polygon points="182,140 188,144 186,150 180,148" fill="#fde047"/>
  </g>

  <!-- Rider 1: WITH HELMET on Motorcycle -->
  <g transform="translate(250, 170)">
    <!-- Helmet Head (Class 0: With Helmet) -->
    <circle cx="70" cy="55" r="32" fill="#10b981"/>
    <!-- Visor -->
    <path d="M 75 45 Q 98 52 82 72 Q 70 70 75 45 Z" fill="#022c22"/>
    <!-- Rider Torso & Jacket -->
    <path d="M 45 88 L 95 88 L 105 150 L 35 150 Z" fill="#334155"/>
    <line x1="45" y1="95" x2="20" y2="135" stroke="#334155" stroke-width="14" stroke-linecap="round"/>
    <line x1="95" y1="95" x2="115" y2="135" stroke="#334155" stroke-width="14" stroke-linecap="round"/>
    <!-- Motorcycle Body -->
    <path d="M 10 220 L 70 145 L 120 145 L 155 210 L 110 260 L 25 250 Z" fill="url(#motoGrad)"/>
    <!-- Handlebar & Headlight -->
    <line x1="105" y1="135" x2="135" y2="135" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>
    <circle cx="145" cy="155" r="12" fill="#fef08a"/>
    <!-- Wheels -->
    <circle cx="30" cy="270" r="34" fill="#0f172a"/>
    <circle cx="30" cy="270" r="15" fill="#e2e8f0"/>
    <circle cx="140" cy="270" r="34" fill="#0f172a"/>
    <circle cx="140" cy="270" r="15" fill="#e2e8f0"/>
  </g>

  <!-- Rider 2: WITHOUT HELMET on Motorcycle (Class 1: Violation!) -->
  <g transform="translate(490, 160)">
    <!-- Head / Hair (No Helmet) -->
    <circle cx="70" cy="50" r="28" fill="#fbcfe8"/>
    <path d="M 45 42 Q 70 20 95 40 Q 90 28 68 26 Q 48 30 45 42 Z" fill="#451a03"/>
    <!-- Eyes / Face profile -->
    <circle cx="82" cy="48" r="4" fill="#1e293b"/>
    <!-- Rider Torso -->
    <path d="M 45 80 L 95 80 L 105 140 L 35 140 Z" fill="#0284c7"/>
    <!-- Motorcycle Body -->
    <path d="M 15 210 L 70 140 L 120 140 L 150 200 L 110 250 L 25 240 Z" fill="#64748b"/>
    <line x1="105" y1="130" x2="135" y2="130" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>
    <circle cx="140" cy="150" r="12" fill="#fef08a"/>
    <!-- Wheels -->
    <circle cx="35" cy="260" r="32" fill="#0f172a"/>
    <circle cx="35" cy="260" r="14" fill="#94a3b8"/>
    <circle cx="135" cy="260" r="32" fill="#0f172a"/>
    <circle cx="135" cy="260" r="14" fill="#94a3b8"/>
  </g>

  <!-- Middle Car (Silver SUV) -->
  <g transform="translate(680, 240)">
    <!-- Shadow -->
    <ellipse cx="120" cy="210" rx="110" ry="16" fill="#020617" opacity="0.6"/>
    <!-- SUV Body -->
    <path d="M 20 175 L 45 105 L 180 105 L 225 150 L 235 190 L 10 190 Z" fill="url(#carSilver)"/>
    <!-- Windows -->
    <path d="M 50 110 L 110 110 L 110 145 L 35 145 Z" fill="#0f172a" opacity="0.75"/>
    <path d="M 120 110 L 180 110 L 210 145 L 120 145 Z" fill="#0f172a" opacity="0.75"/>
    <!-- Wheels -->
    <circle cx="65" cy="190" r="28" fill="#0f172a"/>
    <circle cx="65" cy="190" r="13" fill="#e2e8f0"/>
    <circle cx="190" cy="190" r="28" fill="#0f172a"/>
    <circle cx="190" cy="190" r="13" fill="#e2e8f0"/>
  </g>

  <!-- Right Cyclist / Bicycle -->
  <g transform="translate(890, 210)">
    <!-- Helmet (Class 0: With Helmet) -->
    <path d="M 50 45 Q 75 25 100 45 Q 85 65 50 45 Z" fill="#10b981"/>
    <circle cx="75" cy="50" r="16" fill="#fed7aa"/>
    <!-- Cyclist Body -->
    <line x1="75" y1="65" x2="80" y2="120" stroke="#ea580c" stroke-width="12" stroke-linecap="round"/>
    <!-- Bicycle Frame (Yellow/Amber) -->
    <line x1="30" y1="210" x2="70" y2="210" stroke="#f59e0b" stroke-width="5"/>
    <line x1="70" y1="210" x2="80" y2="150" stroke="#f59e0b" stroke-width="5"/>
    <line x1="30" y1="210" x2="60" y2="160" stroke="#f59e0b" stroke-width="5"/>
    <line x1="60" y1="160" x2="110" y2="210" stroke="#f59e0b" stroke-width="5"/>
    <line x1="80" y1="150" x2="110" y2="210" stroke="#f59e0b" stroke-width="5"/>
    <!-- Wheels -->
    <circle cx="30" cy="210" r="30" fill="none" stroke="#0f172a" stroke-width="6"/>
    <circle cx="110" cy="210" r="30" fill="none" stroke="#0f172a" stroke-width="6"/>
  </g>

  <!-- Far Right Car (Red Sedan) -->
  <g transform="translate(950, 280)">
    <path d="M 20 150 L 50 95 L 160 95 L 200 135 L 210 170 L 10 170 Z" fill="url(#carRed)"/>
    <circle cx="60" cy="170" r="22" fill="#0f172a"/>
    <circle cx="170" cy="170" r="22" fill="#0f172a"/>
  </g>

  <!-- Traffic Light Pole -->
  <g transform="translate(1180, 80)">
    <rect x="25" y="0" width="10" height="280" fill="#475569"/>
    <rect x="10" y="20" width="40" height="90" rx="8" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <circle cx="30" cy="38" r="9" fill="#ef4444"/>
    <circle cx="30" cy="65" r="9" fill="#334155"/>
    <circle cx="30" cy="92" r="9" fill="#10b981"/>
  </g>
</svg>
